<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Kollektivgedächtnis — Operator</title>
<!-- Relative, like projection.html: served at /operator these resolve to /static/… -->
<link rel="stylesheet" href="static/operator.css">
<header>
  <span id="stt" class="badge">STT</span>
  <label>Begriffe auf der Wand
    <!-- Each step gets its resulting term count appended live by operator.js
         ("32 (32)"). The label written here is the base; operator.js keeps it
         in `data-label` on first render so re-rendering cannot stack
         suffixes. Why the count is worth the noise: on 2026-08-26, eight
         interviews in, raising the density produced a blank wall and read as
         a broken control — nothing had been said by three people yet. The
         number says that before the wall goes empty in front of the room.
         Replaces the old "Dichte" (min_mentions, a threshold): spec
         2026-08-29 found that an indirect proxy for the real constraint, how
         many labels fit on the wall — this is a direct cap on term count,
         highest-mentioned and newest first (kg/config.py's `default_max_terms`,
         `frontend/static/graph-model.js`'s selection rule). Step values are a
         starting proposal (spec §4); the exact numbers get set on site
         against the real beamer. -->
    <select id="max-terms">
      <option value="20">20</option>
      <option value="32">32</option>
      <option value="45">45</option>
      <option value="60">60</option>
      <option value="80">80</option>
      <option value="110">110</option>
      <option value="150">150</option>
      <option value="999">alle</option>
    </select>
  </label>
  <label>Kamera
    <select id="camera">
      <option value="fit">alles zeigen</option>
      <option value="manual">manuell</option>
      <option value="pan">automatisch schwenken</option>
    </select>
  </label>
  <label>Zoom
    <!-- Continuous, not three steps (Birk, 2026-08-26): the question being
         answered on site is "far enough in that the labels are readable on
         THIS wall, from THIS distance", and that has no reason to land on one
         of three preset numbers. Range and step match the server's own bound
         (CameraZoom: 1.0-4.0) so the UI can never post a value the API
         rejects. `input` would fire on every pixel of the drag and flood the
         SSE fanout; `change` fires once, when the operator lets go. -->
    <input id="camera-zoom" type="range" min="1" max="4" step="0.05" value="1">
    <output id="camera-zoom-value">1,00×</output>
  </label>
  <label>Porträtgröße
    <!-- Eine OBERGRENZE in Bildschirm-Pixeln, keine feste Größe (Birk,
         2026-08-30). Sie greift nur im Automatikbetrieb ("alles zeigen",
         "automatisch schwenken") und verhindert dort den Fall, den Birk am
         2026-08-29 an der Station gesehen hat: bei einer einzelnen Person
         füllte das Porträt den ganzen Schirm. Steht viel auf der Wand, bleiben
         die Porträts von selbst kleiner und der Regler tut gar nichts. In
         "manuell" gilt die Grenze nicht — dort darf ein Besucher in ein
         Gesicht hineinzoomen, bis es formatfüllend ist. Bereich und Schritt
         spiegeln die Serverschranke (PortraitSize: 40-260), damit die
         Oberfläche keinen Wert posten kann, den die API ablehnt.
         `input`/`change` wie beim Zoom: die Anzeige folgt der Hand, gepostet
         wird erst beim Loslassen. -->
    <input id="portrait-size" type="range" min="40" max="260" step="1" value="120">
    <output id="portrait-size-value">höchstens 120 px</output>
  </label>
  <label>Tempo
    <!-- Speed of the automatic tour as a fraction of its tuned pace: right
         stop = the speed the motion was judged at, left stop = a quarter of
         it. Only downwards on purpose — there is no setting that runs faster
         than what was ever looked at on the wall. -->
    <input id="camera-speed" type="range" min="0.25" max="1" step="0.05" value="1">
    <output id="camera-speed-value">1/1</output>
  </label>
  <span id="interview"></span>
</header>
<pre id="transcript"></pre>
<ul id="entries"></ul>
<script type="module" src="static/operator.js"></script>
</html>
