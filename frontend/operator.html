<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Kollektivgedächtnis — Operator</title>
<!-- Relative, like projection.html: served at /operator these resolve to /static/… -->
<link rel="stylesheet" href="static/operator.css">
<header>
  <span id="stt" class="badge">STT</span>
  <span id="mic" class="badge">MIC</span>
  <label>Begriffe auf der Wand
    <!-- Each step gets its resulting term count appended live by operator.js
         ("32 (32)"). The label written here is the base; operator.js keeps it
         in `data-label` on first render so re-rendering cannot stack
         suffixes. Why the count is worth the noise: on 2026-08-26, eight
         interviews in, raising the density produced a blank wall and read as
         a broken control — nothing had been said by three people yet. The
         number says that before the wall goes empty in front of the room.
         Replaces the old "Dichte" (min_mentions, a threshold): spec
         2026-08-29 found that an indirect proxy for the real constraint, how
         many labels fit on the wall — this is a direct cap on term count,
         highest-mentioned and newest first (kg/config.py's `default_max_terms`,
         `frontend/static/graph-model.js`'s selection rule). Step values are a
         starting proposal (spec §4); the exact numbers get set on site
         against the real beamer. -->
    <select id="max-terms">
      <option value="20">20</option>
      <option value="32">32</option>
      <option value="45">45</option>
      <option value="60">60</option>
      <option value="80">80</option>
      <option value="110">110</option>
      <option value="150">150</option>
      <option value="999">alle</option>
    </select>
  </label>
  <label>Kamera
    <select id="camera">
      <option value="fit">alles zeigen</option>
      <option value="manual">manuell</option>
      <option value="pan">automatisch schwenken</option>
    </select>
  </label>
  <label>Mindestschrift
    <!-- Die kleinste Schrift, die auf dieser Wand noch stehen soll, in
         gezeichneten Pixeln. Bis zum 2026-09-02 stand hier ein Zoomfaktor
         („1,55x enger als die Vollansicht"); der beantwortete die falsche
         Frage. Vor Ort wird entschieden „kann man das von hier lesen", und
         das ist eine Groesse, keine Vergroesserung — ein Faktor auf ein
         kleines Netz angewandt zoomt in drei Begriffe hinein (Birk,
         2026-09-02: „alles viel zu gross und viel zu nah").

         Aus derselben Zahl folgt auch, OB die Kamera faehrt: Liefert die
         Vollansicht schon diese Schriftgroesse, steht die Wand still.

         Stufenlos und nicht in Stufen, aus demselben Grund wie beim alten
         Regler. Bereich und Schritt spiegeln die Serverschranke
         (CameraMinLabel: 8-120), damit die Oberflaeche keinen Wert posten
         kann, den die API ablehnt. `input` feuerte bei jedem Pixel des Ziehens
         und flutete die SSE-Verteilung; `change` feuert einmal, beim
         Loslassen. -->
    <input id="camera-min-label" type="range" min="8" max="120" step="1" value="40">
    <output id="camera-min-label-value">mindestens 40 px</output>
  </label>
  <label>Porträtgröße
    <!-- Eine OBERGRENZE in Bildschirm-Pixeln, keine feste Größe (Birk,
         2026-08-30). Sie greift nur im Automatikbetrieb ("alles zeigen",
         "automatisch schwenken") und verhindert dort den Fall, den Birk am
         2026-08-29 an der Station gesehen hat: bei einer einzelnen Person
         füllte das Porträt den ganzen Schirm. Steht viel auf der Wand, bleiben
         die Porträts von selbst kleiner und der Regler tut gar nichts. In
         "manuell" gilt die Grenze nicht — dort darf ein Besucher in ein
         Gesicht hineinzoomen, bis es formatfüllend ist. Bereich und Schritt
         spiegeln die Serverschranke (PortraitSize: 40-260), damit die
         Oberfläche keinen Wert posten kann, den die API ablehnt.
         `input`/`change` wie beim Zoom: die Anzeige folgt der Hand, gepostet
         wird erst beim Loslassen. -->
    <input id="portrait-size" type="range" min="40" max="700" step="5" value="120">
    <output id="portrait-size-value">höchstens 120 px</output>
  </label>
  <label>Tempo
    <!-- Speed of the automatic tour as a fraction of its tuned pace: right
         stop = the speed the motion was judged at, left stop = a quarter of
         it. Only downwards on purpose — there is no setting that runs faster
         than what was ever looked at on the wall. -->
    <input id="camera-speed" type="range" min="0.05" max="1" step="0.05" value="1">
    <output id="camera-speed-value">1/1</output>
  </label>
  <!-- Der Interviewschalter: erst der Zustand, dann die beiden Wege.

       Rückfall für den Mikrofonschalter (Birk, 2026-09-01: „Als Backup sollte
       allerdings auch noch ein Button in einem Operator UI sein für
       Interview-Stop, falls die Interviewperson das vergisst"), seit dem
       2026-09-02 in beide Richtungen („Was mir noch fehlte, ist der
       Start-Stopp-Button im Operator-Panel, analog zur APK-App").

       Den Schalter am Mikrofon bedient eine eingewiesene Interviewperson,
       nicht der Gast — er bleibt der verlässliche Weg, dieses Paar ist das
       Netz darunter. Deshalb steht es neben der Statusanzeige und nicht bei
       den Reglern: Wer hier hinsieht, sieht zuerst, DASS ein Interview läuft,
       und erst dann den Weg, es zu ändern.

       Beide rufen denselben Endpunkt wie der Schalter
       (`/api/interview_switch`) — ein zweiter Weg zum selben Ziel, kein
       zweiter Mechanismus, der eigene Zustände erzeugen könnte.

       🔴 ZWEI KNÖPFE UND KEIN UMSCHALTER. Die App hat einen
       (`neuerZustand = !laeuft`), dessen Beschriftung an einem gepollten
       Zustand hängt. Stand der schief, tat er das Gegenteil: In der Nacht zum
       2026-09-02, um 01:14:51, schickte ein Druck auf „Start" in Wahrheit
       „Stopp" — Birks offenes Interview war zu, das vierte Foto lief in ein
       409. Hier trägt jeder Knopf seinen absoluten Wert fest im Code; ein
       Druck bei falschem Anzeigestand kann deshalb höchstens wirkungslos
       sein (`SessionTracker.mic_switch` ist idempotent), nie das Gegenteil.

       Beide starten GESPERRT, samt „Zustand unbekannt" daneben: Zwischen dem
       Aufschlagen der Seite und der ersten SSE-Meldung weiß diese Seite über
       das Interview nichts, und „kein Interview" wäre dann keine Auskunft,
       sondern eine Vermutung — ausgerechnet die, die den Startknopf scharf
       stellt, während im Raum vielleicht längst jemand spricht. -->
  <span id="interview">Zustand unbekannt</span>
  <button id="interview-start" type="button" disabled>Interview starten</button>
  <button id="interview-stop" type="button" disabled>Interview beenden</button>
  <!-- Die Rückmeldung, wie die App sie gibt: Ein Druck, dessen Wirkung im
       Nebenraum stattfindet, ist ohne sie nicht von einem Druck ins Leere zu
       unterscheiden. -->
  <output id="interview-meldung"></output>

  <!-- 🔴 DIE ZWEITE FRAGE ZUR SPRACHERKENNUNG (2026-09-02, real passiert).
       Das STT-Abzeichen oben beantwortet „steht die Verbindung zu 5051" — die
       stand bei einem Whisper-Ausfall bei Infomaniak die ganze Zeit, grün.
       Pegel schlug aus, Gate öffnete, ein Interview lief, und es kam kein
       einziges Wort an: 26 Äußerungen, 0 Transkripte. Sichtbar war das nur im
       Log des fremden Dienstes, unter 17.000 Zeilen `GET /levels`.

       Deshalb ein ZWEITER Wert daneben statt einer Umdeutung des ersten:
       „verstehen sie mich" ist eine andere Frage als „ist der Draht dran".

       Der Wechselknopf ist bewusst kein Automatismus. ElevenLabs steht in den
       USA; die ganze Kette ist EU-souverän gebaut (Infomaniak in Genf, BFL in
       der EU). Ein stiller Fallback bei jedem Aussetzer würde Stimmen von
       Menschen außerhalb der EU verarbeiten, ohne dass jemand entschieden
       hätte. Wie beim Spiegel-Uploader gilt: gedrückt heißt entschieden. -->
  <div id="stt-aufsicht" class="aufsicht">
    <span id="stt-gesund" class="badge">Whisper</span>
    <span id="stt-anbieter">Anbieter unbekannt</span>
    <button id="stt-wechsel" type="button" disabled>Anbieter wechseln</button>
    <output id="stt-meldung"></output>
  </div>
</header>
<pre id="transcript"></pre>
<ul id="entries"></ul>
<script type="module" src="static/operator.js"></script>
</html>
