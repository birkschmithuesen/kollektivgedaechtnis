<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Kollektivgedächtnis</title>
<!-- Asset paths are relative so the page also loads from a plain file server
     (tests, pre-render harness); served at /projection they resolve to /static/… -->
<link rel="stylesheet" href="static/base.css">
<link id="theme" rel="stylesheet" href="static/theme-e.css">
<div id="cy"></div>
<!-- Der QR-Code auf die oeffentliche Handyseite (Birk, 2026-09-01:
     „ohne Text so unauffaellig wie moeglich, Ecke ist OK, Hintergrund mit
     Transparenz"). Nackt in der Ecke, keine Beschriftung, kein Kasten.
     Statisch als Datei eingebunden, nicht zur Laufzeit gerechnet: die Adresse
     aendert sich nicht, und eine unbeaufsichtigte Wand soll keinen Weg mehr
     haben, auf dem sie scheitern kann. Neu erzeugen mit
     `uv run --with segno python scripts/qr-erzeugen.py`.
     Die Deckkraft steht in base.css und ist gemessen, nicht geschaetzt. -->
<aside class="qr-hinweis" aria-hidden="true">
  <img src="static/qr-handyseite.svg" alt="" class="qr-bild">
</aside>
<!-- Order matters: these UMD bundles resolve each other off `window`, and the
     two extensions self-register against the `cytoscape` global. See
     static/vendor/README.md. -->
<script src="static/vendor/cytoscape.min.js"></script>
<script src="static/vendor/layout-base.js"></script>
<script src="static/vendor/cose-base.js"></script>
<script src="static/vendor/cytoscape-fcose.js"></script>
<script src="static/vendor/cytoscape-layout-utilities.js"></script>
<script type="module">
  import { createGraphView } from './static/projection.js';
  import { attachTouchAutonomy } from './static/touch-autonomy.js';
  import { createTouchControls } from './static/touch-controls.js';
  import { attachZoomGeste } from './static/touch-zoom-geste.js';
  import { attachQuoteOverlay } from './static/quote-overlay.js';
  import { attachLegende } from './static/legende.js';
  import { attachPlenumHinweis } from './static/plenum-hinweis.js';

  const themeLink = document.getElementById('theme');
  const params = new URLSearchParams(location.search);

  // Die Saalfläche (Birk, 2026-09-01: „Für den Ausspieler im Plenarsaal
  // brauchen wir ein eigenes Design"). Erreichbar über `/plenum`, das genau
  // hierher umleitet.
  //
  // Ein SCHALTER auf dieser Seite und keine zweite Seite: eine `plenum.html`
  // müsste die Ladereihenfolge der Cytoscape-Bundles, den Theme-Ladevertrag
  // unten, den SSE-Anschluss und die Zustandsanwendung wörtlich wiederholen —
  // und liefe von dort an auseinander. Dieselbe Überlegung, aus der das
  // Zitat-Overlay auf JEDER Fläche hängt (siehe unten), nur eine Ebene höher.
  //
  // Die Unterschiede sind vier, und alle vier stehen an genau einer Stelle:
  //   1. `static/plenum.css` als Auflage über dem Theme (Maße, kein Farbcode)
  //   2. keine Legende
  //   3. keine Positionen zurückschreiben
  //   4. der Erklärungstext, und die Regler kommen aus `state.plenum`
  const istPlenum = params.get('plenum') === '1';
  // Validate against the themes that actually exist. This is an unattended
  // wall, not a form with a user to correct a typo: an unrecognised
  // `?theme=` value (typo, retired name, anything) must fall back to the
  // default rather than ever producing a broken href.
  // 'f' ist der Schwarzplan-Entwurf (2026-08-30): Begriffe als beschriftete
  // Flaechen statt Punkt+Text, Achsenfarbe in der Flaeche, Kantenboegen.
  // 'e' bleibt daneben bestehen, damit beide vergleichbar sind.
  // 'd' fehlt hier absichtlich: theme-d.css ist das Testbild (/testpattern),
  // kein Graph-Theme. 'e' war ab 2026-08-30 die Vorgabe; seit 2026-09-01 ist
  // es 'f' (Birk: „das Standard-Graph-Layout soll f sein, wenn kein Kommentar
  // kommt, soll immer f geladen werden"). Beide tragen die Farbcodierung der
  // drei Auswahlachsen, ohne die die Markierung an der Wand nur ein Ja/Nein
  // waere — der Wechsel kostet sie also nicht.
  //
  // Die Vorgabe steht bewusst HIER und nicht nur in der Wandadresse: die
  // oeffentliche Handy-Seite und jeder Aufruf ohne `?theme=` gehen durch
  // genau diese Zeile, und dort fehlte das Theme bisher (Birk, 2026-09-01:
  // „bei kollektivgedaechtnis.flashclash.de wird das zbsp nicht geladen").
  const KNOWN_THEMES = ['a', 'b', 'c', 'e', 'f'];
  const requestedTheme = params.get('theme');
  const theme = KNOWN_THEMES.includes(requestedTheme) ? requestedTheme : 'f';
  const themeHref = `static/theme-${theme}.css`;
  // Swapping `href` starts an async fetch. createGraphView() reads the
  // stylesheet synchronously via getComputedStyle (projection.js's cssVar()),
  // so it must not run until the new stylesheet has actually loaded — a
  // requestAnimationFrame is not a substitute for the real `load` event,
  // it only guarantees a paint tick, not that the async fetch resolved.
  // Reassigning `href` to the value it already has (the `?theme=a` default,
  // matching the markup's initial href) does NOT fire another `load` event
  // in Chromium, so that case must resolve immediately instead of waiting.
  const themeLoaded = new Promise((resolve) => {
    if (themeLink.getAttribute('href') === themeHref) {
      resolve();
      return;
    }
    themeLink.addEventListener('load', resolve, { once: true });
    // Defensive fallback for a legitimate theme file missing or broken at
    // deploy time (the `?theme=` value itself is already validated above,
    // so this only fires for a deploy-time asset problem). A stylesheet
    // that fails to load fires `error`, never `load` — without this, the
    // promise above would hang forever and the wall would show nothing
    // indefinitely with no operator recourse. A degraded render (whatever
    // CSS state exists) beats a blank wall.
    themeLink.addEventListener(
      'error',
      () => {
        console.warn(`theme stylesheet failed to load: ${themeHref}`);
        resolve();
      },
      { once: true },
    );
    themeLink.href = themeHref;
  });

  // Die Saal-Auflage. Sie wird NUR im Plenum-Zweig überhaupt ins Dokument
  // gehängt: kein `<link>` im Markup, kein `disabled`-Zustand, kein zweiter
  // Aufruf ohne Wirkung. Was nicht geladen ist, kann die Foyer-Wand auch nicht
  // verändern — das ist die bauliche Zusicherung hinter
  // `tests/test_foyer_unveraendert.py`, keine Absichtserklärung.
  //
  // NACH dem Theme-Link eingehängt, damit sie im Kaskadenrang gewinnt: Beide
  // schreiben `:root`, gleiche Spezifität, also entscheidet die Reihenfolge im
  // Dokument — nicht die Ladereihenfolge im Netz.
  //
  // Auf ihr `load` wird genauso gewartet wie auf das Theme, und aus demselben
  // Grund: `createGraphView()` liest die Variablen synchron über
  // getComputedStyle. Käme sie eine Zehntelsekunde später, stünde im Saal das
  // Foyer-Design — sichtbar, aber nicht als Fehler erkennbar.
  const auflageGeladen = new Promise((resolve) => {
    if (!istPlenum) {
      resolve();
      return;
    }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.id = 'plenum';
    link.href = 'static/plenum.css';
    link.addEventListener('load', resolve, { once: true });
    // Wie beim Theme: eine fehlende Datei feuert `error` und niemals `load`.
    // Ohne diesen Zweig bliebe die Saalwand für immer schwarz.
    link.addEventListener(
      'error',
      () => {
        console.warn('plenum stylesheet failed to load: static/plenum.css');
        resolve();
      },
      { once: true },
    );
    themeLink.after(link);
  });

  // How slow "slow" is, in ms. The migration is the transition a visitor
  // watches when their own node joins the wall (spec 10.3), and the right
  // speed is a projector-and-room judgement Birk makes on site — so it is a
  // setting of the page, not a constant only a rebuild can change. The
  // pre-render also uses it to spread its mid-flight frames far enough apart
  // to be readable as a sequence.
  const requestedMigration = Number(params.get('migration'));
  const migrationDuration = requestedMigration > 0 ? requestedMigration : undefined;

  Promise.all([themeLoaded, auflageGeladen]).then(() => {
    const view = createGraphView(document.getElementById('cy'), {
      migrationDuration,
      // 🔴 Die Saalfläche schreibt KEINE Positionen zurück.
      //
      // Das ist der eine Weg, auf dem die Plenar-Ansicht das Foyer trotz
      // getrennter Einstellungen doch verändert hätte: Sie rechnet mit
      // größerer Schrift und größerem Tafelpolster, fcose kommt für neue
      // Knoten also auf ein anderes Ergebnis — und `/api/positions` schreibt
      // in dieselbe `position`-Tabelle, aus der das Foyer beim nächsten
      // Neuladen sein Netz holt. Das mühsam kalibrierte Bild von heute wäre
      // still ein anderes geworden, ohne dass jemand die Ursache sähe.
      //
      // Die Fläche im Saal ist eine reine Anzeige. Gespeichert wird das
      // Layout dort, wo es beurteilt wird.
      ...(istPlenum
        ? {}
        : {
            onPositions: (positions) =>
              fetch('/api/positions', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ positions }),
              }).catch((error) => console.warn('failed to persist positions', error)),
          }),
    });
    window.kgView = view;
    window.kgReady = false;

    // Quote on touch (spec §10.2's parked nice-to-have). Attached on every
    // surface, not just the touchscreen: surface C gets no visitors, so it
    // simply never fires there, and keeping one code path avoids a second
    // page that drifts from this one.
    const quotes = attachQuoteOverlay(view);
    window.kgQuotes = quotes;

    // Die Deutung des Farbcodes (Birk, 2026-09-01). Nach dem Theme-`load`,
    // weil die drei Farben AUS dem geladenen Stylesheet gelesen werden — vorher
    // stünden die Variablen noch nicht zur Verfügung und die Legende fiele
    // still aus. Themes ohne Farbcodierung liefern `null`, dann gibt es keine.
    //
    // Im Saal gar nicht (Birk, 2026-09-01: „Legende weg"). Sie erklärt einen
    // Farbcode, den die Saal-Auflage bewusst abschaltet — sie hätte dort drei
    // gleichfarbige Punkte mit drei verschiedenen Wörtern gezeigt und damit
    // etwas behauptet, was auf der Fläche nicht mehr stimmt.
    window.kgLegende = istPlenum ? null : attachLegende();

    // Der Erklärungstext, nur im Saal (Birk, 2026-09-01). Sein Takt kommt
    // gleich aus dem Zustand; bis der erste Push da ist, laufen die Vorgaben
    // aus dem Modul.
    const hinweis = istPlenum ? attachPlenumHinweis() : null;
    window.kgPlenumHinweis = hinweis;

    // Surface A only (`?touch=1`). Surface C in the plenary room loads the same
    // page without the flag and stays a pure display: no controls to press, no
    // local mode override, exactly the operator's setting all day.
    const isTouch = params.get('touch') === '1';
    let autonomy = null;
    let controls = null;
    let geste = null;
    if (isTouch) {
      autonomy = attachTouchAutonomy(view, {
        // Nimmt die Wand sich nach 30 s Ruhe (oder auf „Übersicht") selbst
        // zurück, muss der Griff des Zoom-Reglers mitgehen — sonst zeigt er
        // den Ausschnitt des letzten Besuchers an, während die Wand längst
        // wieder wandert. Über den Rückgabewert und nicht über einen zweiten
        // Zugriff auf das DOM, damit es genau einen Ort gibt, der weiß, wo der
        // linke Anschlag liegt (touch-controls.js).
        onRelease: () => controls && controls.resetZoom(),
      });
      // Nothing wired in here may post: whatever a visitor presses on surface A
      // must stay on surface A (see touch-controls.js and touch-autonomy.js).
      controls = createTouchControls(document.body, {
        onOverview: () => {
          // Two things at once, because "Übersicht" means one thing to the
          // visitor: leave my manual zoom AND show the whole net.
          autonomy.releaseNow();
          view.camera.setZoomFactor(1);
          view.camera.setMode('fit');
        },
        // Der Ersatz für die Zweifingergeste. Rein lokal: `setVisitorZoom`
        // schreibt in den Viewport DIESER Seite, genau wie ein Pinch es täte,
        // und nicht in `camera_zoom` — das ist die Kalibrierung des Operators
        // und gilt auf allen Flächen.
        onZoom: (faktor) => view.camera.setVisitorZoom(faktor),
      });
      // Die Zwei-Finger-Geste (Nachtrag Birk, 2026-09-01: „wir müssen dort
      // auch das Zoom hinbekommen … ich würde gerne das Zoom haben"). Sie ist
      // seit dem Umzug auf das MacBook der Hauptweg, der Regler darüber der
      // Rückfallweg — beide schreiben in denselben lokalen Viewport und keiner
      // von beiden postet.
      //
      // Erst NACH `controls`, weil `onZoom` den Griff des Reglers nachführt.
      geste = attachZoomGeste(view, {
        // 🔴 Ohne das läuft die Geste ins Leere: `userZoomingEnabled` ist nur
        // in `manual` wahr, und im Modus `pan` überschriebe `step()` den Zoom
        // im nächsten Frame wieder. Dieselbe Tür wie eine Berührung des
        // Graphen — samt der 30-s-Ruheuhr, die die Wand danach von selbst
        // zurückholt.
        onSteuern: () => autonomy.poke(),
        // Damit der Griff nicht etwas anderes anzeigt als das Bild.
        onZoom: (faktor) => controls && controls.showZoom(faktor),
      });
      window.kgTouch = { autonomy, controls, geste };
    }

    const events = new EventSource('/events');
    events.onmessage = (message) => {
      const payload = JSON.parse(message.data);
      if (payload.type === 'graph') {
        view.update(payload.graph);
        quotes.setGraph(payload.graph);
        window.kgReady = true;
      } else if (payload.type === 'state') {
        // 🔴 WELCHE Regler diese Fläche liest — die eine Zeile, an der die
        // Trennung der beiden Flächen hängt.
        //
        // Der Zustand trägt beide Sätze nebeneinander: die Foyer-Werte oben
        // (unverändert, wo sie immer waren) und die Saalwerte unter `plenum`.
        // Jede Fläche greift genau ihren Satz ab, gespeichert wird unter
        // eigenen Schlüsseln (`plenum_*`, siehe kg/server.py).
        //
        // Der Rückfall auf die Foyer-Werte ist nicht Zierde: Ein älterer
        // Server ohne `plenum`-Block darf im Saal kein leeres Bild ergeben.
        // Dann läuft dort eben das Foyer-Verhalten — schlechter, aber
        // sichtbar, und das ist an einer unbeaufsichtigten Wand die richtige
        // Richtung zu scheitern.
        const regler = (istPlenum && payload.state.plenum) || payload.state;

        // The operator's term cap applies to every surface, touchscreen
        // included — it just has no counterpart to reflect there any more.
        view.setMaxTerms(regler.max_terms);
        // Route the operator's mode through the autonomy guard on the touch
        // surface: applying it directly would snatch the view away from a
        // visitor mid-gesture. Everywhere else it applies immediately.
        if (autonomy) autonomy.setOperatorMode(regler.camera_mode);
        else view.camera.setMode(regler.camera_mode);
        // D4: the zoom level is an on-site setting, carried in the same state
        // push as the mode. Guard the value — setZoomFactor throws below 1,
        // and an exhibition wall must degrade rather than stop rendering.
        const zoom = Number(regler.camera_zoom);
        if (zoom >= 1) view.camera.setZoomFactor(zoom);
        // Guarded the same way: setRoamSpeed clamps rather than throws, but an
        // absent field (older server, replayed state) must leave the pace alone
        // instead of resetting it to full.
        const speed = Number(regler.camera_speed);
        if (speed > 0) view.camera.setRoamSpeed(speed);
        // How big a portrait may get on this wall in the driven modes, in
        // rendered pixels. A separate control from the zoom on purpose (the
        // zoom picks the SECTION, this bounds the faces in it), and guarded
        // the same way: an absent or unusable value must leave the wall at the
        // bound it is showing.
        const portraitSize = Number(regler.portrait_size);
        if (portraitSize > 0) view.setPortraitSize(portraitSize);

        // Die beiden Saal-Regler, die keine Entsprechung im Foyer haben. Die
        // QR-Größe geht als CSS-Variable an dieselbe Stelle, an der auch die
        // Auflage sie setzt (`--qr-size`) — es gibt keinen zweiten Weg, die
        // Größe zu bestimmen, und damit auch keinen, auf dem die beiden
        // auseinanderlaufen.
        if (istPlenum) {
          const qrGroesse = Number(regler.qr_size);
          if (qrGroesse > 0) {
            document.documentElement.style.setProperty('--qr-size', `${qrGroesse}px`);
          }
          if (hinweis) {
            hinweis.setTakt({
              intervallMs: Number(regler.hinweis_intervall) * 1000,
              dauerMs: Number(regler.hinweis_dauer) * 1000,
            });
          }
        }
      }
    };
  });
</script>
</html>
