<!doctype html>
<html lang="de" data-strip-mode="aspect">
<meta charset="utf-8">
<title>Kollektivtraum</title>
<!-- Relative asset paths, like Tool 1's pages: served at /dream these resolve
     to /static/… and the harness can load the same module from a file server. -->
<link rel="stylesheet" href="static/dream.css">
<div id="page">
  <div id="stage">
    <img class="frame" id="frame-a" alt="">
    <img class="frame" id="frame-b" alt="">
    <div id="typewriter" hidden></div>
  </div>
  <div id="sentence"></div>
  <ul id="strip"></ul>
</div>
<script type="module">
  import { createDreamView } from './static/dream.js';

  // Review finding: the strip's crop-vs-shrink trade-off was Birk's call, not
  // this file's. Seit dem Vollbild-Umbau (2026-08-30) liegt der Streifen AUF
  // dem Bild; `wrap` ist damit entfallen, weil weitere Reihen ins Bild
  // hineinwüchsen (Begründung in dream.css). `aspect` (oben gesetzt) ist der
  // Standard und hält Birks Grund von 2026-08-26 — kein einzelnes Bild wird
  // zugeschnitten. `?strip_mode=cover` auf der URL ist, wie
  // sim/dream_prerender.py's --strip-mode das Vergleichsrendering fährt, und
  // wie man den Modus von Hand ansieht.
  const stripMode = new URLSearchParams(location.search).get('strip_mode');
  if (stripMode) document.documentElement.dataset.stripMode = stripMode;

  const view = createDreamView(document.documentElement);
  window.kgDream = view;
  window.kgDreamReady = false;

  // The state push is complete state, like Tool 1's graph event — there is no
  // delta to miss, so a dropped event costs nothing and a reconnect needs no
  // catch-up logic.
  const events = new EventSource('/events');
  events.onmessage = (message) => {
    const payload = JSON.parse(message.data);
    if (payload.type === 'state') {
      view.applyState(payload.state);
      window.kgDreamReady = true;
    } else if (payload.type === 'dreaming') {
      view.showDreaming(payload.sentence);
    } else if (payload.type === 'dream_failed') {
      // Finding 1: stage 2 failed after stage 1 already announced a
      // sentence. No `state` event follows a failure (the baseline is
      // untouched on purpose), so this is the one signal that clears a
      // typewriter build left stranded mid-word.
      view.dreamFailed();
    }
  };
</script>
</html>
