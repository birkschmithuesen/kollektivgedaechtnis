# Vhost-Vorlage für herkules (nginx 1.24, Ubuntu 24.04).
#
# Gebaut wie der bestehende /etc/nginx/sites-enabled/herkules: :80 leitet auf
# HTTPS um, mit einer Ausnahme für /.well-known (sonst kann Certbot das
# Zertifikat nicht erneuern — die Prüfung kommt über HTTP), :443 trägt die
# Let's-Encrypt-Pfade und reicht an den Empfänger auf 127.0.0.1:8820 weiter.
#
# Einsetzen:
#
#   sed 's/__HOST__/spiegel.example.org/g' mirror/nginx-kg-mirror.conf \
#     | sudo tee /etc/nginx/sites-available/kg-mirror
#   sudo ln -s ../sites-available/kg-mirror /etc/nginx/sites-enabled/kg-mirror
#   sudo certbot certonly --webroot -w /var/www/html -d spiegel.example.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reihenfolge beachten: certbot VOR dem ersten `nginx -t` mit aktivem
# :443-Block, sonst zeigen `ssl_certificate`-Pfade auf Dateien, die es noch
# nicht gibt, und nginx startet gar nicht mehr.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location /.well-known/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Der Uploader schickt Bilder als rohen Körper. Standard sind 1 MB; ein
    # Traumbild ist grösser, und der Empfänger deckelt selbst bei 25 MB.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ZWINGEND für /events. Ohne diese vier Zeilen sammelt nginx den
        # Ereignisstrom in seinem Puffer, gibt ihn nie heraus, und die Seite
        # bleibt auf dem Stand des ersten Aufrufs stehen — ohne Fehlermeldung,
        # ohne dass irgendwo etwas rot wird. Der teuerste Fehler dieses
        # Aufbaus, weil er wie „funktioniert" aussieht.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        # `Connection: ""` und HTTP/1.1 gehören zusammen: leer heisst
        # keep-alive, und ohne 1.1 fällt nginx auf 1.0 zurück, wo der lange
        # offene Strom nicht vorgesehen ist.
    }
}
