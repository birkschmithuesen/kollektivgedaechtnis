# Copy to config.toml on the exhibition machine and adjust.
# Secrets are NOT stored here — export them in the environment:
#   export ANTHROPIC_API_KEY=...
#   export KG_TELEGRAM_TOKEN=...
#   export OPENROUTER_API_KEY=...      # embeddings only, may be a separate key

data_dir = "data"

# External STT server (see docs/stt-contract.md). Do not fork it.
# Start it from the fundusbot checkout with:
#   python -m fundusapps.stt_server elevenlabs-scribe --language de
stt_url = "http://127.0.0.1:5051"

# Only accept Telegram messages from this chat (leave unset to accept all).
# telegram_chat_id = 123456789

# Safety net so a forgotten stop cannot swallow the next interview (spec 5).
interview_timeout_s = 900

stop_phrases = [
    "Interview beendet",
    "Interview ist beendet",
    "Aufnahme beenden",
    "Aufnahme ist beendet",
]

# Der Name, mit dem die Gäste den Telegram-Bot ansprechen. Steht er vor einer
# der Phrasen oben („Utopia, das Interview ist damit beendet"), gilt der Stopp
# auch dann, wenn die Phrase dahinter freier formuliert ist — wer den Bot beim
# Namen nennt, meint es eindeutig, und beiläufig sagt „Utopia" niemand. Die
# Phrasen allein wirken unverändert weiter. Heißt der Bot einmal anders, wird
# er hier umbenannt; leer lassen schaltet den Weg ab.
#
# „Utopia", NICHT „Utopie" (Birk, 2026-08-31): Beim Thema dieser Station liegt
# nur ein Vokal dazwischen, und die falsche Form ist ein Wort, das Gäste
# wirklich benutzen — „wir brauchen eine Utopie" darf keinen Modellaufruf
# kosten und erst recht keine Aufnahme beenden. Es hält, weil auf ganze Wörter
# geprüft wird: „Utopie", „Utopien", „utopisch" sind andere Token und treffen
# nicht.
wake_word = "Utopia"

# Greift hinter dem Namen KEINE der Phrasen oben, entscheidet ein kleines
# Modell, ob trotzdem ein Beenden-Befehl gemeint war. Anlass: Birk beendete am
# 2026-08-30 an der Station mit „Hiermit beende ich das Interview." — das Verb
# steht voran, keine konfigurierte Phrase passt, das Interview blieb offen.
# Keine Phrasenliste löst das allgemein; niemand schreibt vorab alle
# natürlichen Formulierungen auf.
#
# Das Wake-Word ist dabei der Torwächter: OHNE den Namen wird NIE gefragt (kein
# Dauerlauschen, keine Kosten, keine Latenz), und ein mechanischer Treffer
# fragt ebenfalls nicht — der schnelle, kostenlose Normalfall bleibt, wie er
# ist. Ein Treffer über diesen Weg steht als `spoken_llm` in der Datenbank,
# der mechanische als `spoken`.
#
# Timeout, Fehler oder ein totes Proxy beenden NICHTS: das Interview läuft
# weiter, der 15-Minuten-Timeout und die Textnachricht an den Bot bleiben der
# sichere Weg. `false` verhält sich exakt wie vor dem 2026-08-30.
wake_word_llm = true
# Bewusst nicht `llm_model`: hier fällt ein einziges Ja/Nein, nicht die
# Verdichtung eines Interviews. Sonnet und nicht Haiku 4.5, weil kg/llm.py
# immer `output_config.effort` mitschickt und Haiku 4.5 das ablehnt.
wake_word_llm_model = "claude-sonnet-5"
# Hartes Budget für diesen einen Aufruf — er liegt im heißen Pfad einer
# laufenden Aufnahme. Eine Antwort, die später kommt, wird verworfen. Gemessen
# am 2026-08-30 über Birks Proxy: 1,8-2,9 s für die fünf Beispiele oben, also
# rund das Doppelte des Schlechtesten als Budget.
wake_word_llm_timeout_s = 6.0

# Calibrated in simulation (spec 6.3), NOT runtime-adjustable.
# Run 19b (60 interviews, out/sim19b/sim.db, .superpowers/sdd/task-19-report.md):
#   the model self-limits to 4.35 terms per interview against this cap of 5, so
#   lowering it trims good terms rather than the singleton tail. Left at 5.
terms_per_interview = 5
# Run 19b: in 7 of 8 near-misses the concept's own node sat at rank 7-56 in the
# candidate pool, i.e. outside a window of 5 — the judge was never shown it.
# Run 19c raised this to 12, which is nearly free (embeddings are cached; only
# merge-prompt tokens grow), and a later audit of run 19c confirmed it worked:
# in 22 of 26 examined duplicate pairs the existing node was inside the top 12,
# usually at rank 1 (docs/merge-audit-2026-08-27.md). Candidate selection is no
# longer the bottleneck; most remaining non-merges are the judge deliberately
# declining, not a missed candidate. It is not a cure-all and must not be
# widened further to chase a score: single cases still sit outside the window
# („Ungenutzte Vorzeigeprojekte" vs. „Leerstehende Häuser im Dorfkern", rank 58
# of 87) and are genuine semantic distance, not a window that is still too
# narrow.
merge_neighbours = 12

# merge_style (see kg.config.DEFAULT_MERGE_STYLE) is left unchanged by run 19b:
# only 1 of the 8 near-misses was the judge's decision, the other 7 never
# reached it. Loosening the dial would also loosen the 49 of 60 interviews where
# the judge is currently deciding well.

llm_model = "claude-opus-5"
llm_effort = "high"

# Embedding preselection via OpenRouter (spec 6.2). Cached by term text in
# data_dir/embeddings.sqlite3, so simulation re-runs are free and offline.
embedding_model = "openai/text-embedding-3-small"
embedding_url = "https://openrouter.ai/api/v1/embeddings"

# Display cap start value: how many term labels may be on the wall at once,
# the operator dial changes it at runtime (spec 2026-08-29). Replaces the old
# `default_min_mentions` (a mention-count threshold) -- that was an indirect
# proxy for the real constraint, how many labels fit before they collide or
# shrink below reading size. Run 19c (60 interviews): 163 terms produced 56
# label collisions unfiltered; a cap of 32 measured 2 collisions and ~14.7px
# type on a 1920x1080 projection (docs/operations.md has the full table).
default_max_terms = 32

server_host = "127.0.0.1"
server_port = 8800
