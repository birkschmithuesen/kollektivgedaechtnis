# Copy to config.toml on the exhibition machine and adjust.
# Secrets are NOT stored here — export them in the environment:
#   export ANTHROPIC_API_KEY=...
#   export KG_TELEGRAM_TOKEN=...
#   export OPENROUTER_API_KEY=...      # embeddings only, may be a separate key

data_dir = "data"

# External STT server (see docs/stt-contract.md). Do not fork it.
# Start it from the fundusbot checkout with:
#   python -m fundusapps.stt_server elevenlabs-scribe --language de
stt_url = "http://127.0.0.1:5051"

# Only accept Telegram messages from this chat (leave unset to accept all).
# telegram_chat_id = 123456789

# Safety net so a forgotten stop cannot swallow the next interview (spec 5).
interview_timeout_s = 900

stop_phrases = [
    "Interview beendet",
    "Interview ist beendet",
    "Aufnahme beenden",
    "Aufnahme ist beendet",
]

# Calibrated in simulation (spec 6.3), NOT runtime-adjustable.
# Run 19b (60 interviews, out/sim19b/sim.db, .superpowers/sdd/task-19-report.md):
#   the model self-limits to 4.35 terms per interview against this cap of 5, so
#   lowering it trims good terms rather than the singleton tail. Left at 5.
terms_per_interview = 5
# Run 19b: in 7 of 8 near-misses the concept's own node sat at rank 7-56 in the
# candidate pool, i.e. outside a window of 5 — the judge was never shown it.
# Run 19c raised this to 12, which is nearly free (embeddings are cached; only
# merge-prompt tokens grow). It is not a cure-all and must not be widened
# further to chase a score: some near-misses are genuine semantic distance
# („Zugebaute Baulücken" sat at rank 56).
merge_neighbours = 12

# merge_style (see kg.config.DEFAULT_MERGE_STYLE) is left unchanged by run 19b:
# only 1 of the 8 near-misses was the judge's decision, the other 7 never
# reached it. Loosening the dial would also loosen the 49 of 60 interviews where
# the judge is currently deciding well.

llm_model = "claude-opus-5"
llm_effort = "high"

# Embedding preselection via OpenRouter (spec 6.2). Cached by term text in
# data_dir/embeddings.sqlite3, so simulation re-runs are free and offline.
embedding_model = "openai/text-embedding-3-small"
embedding_url = "https://openrouter.ai/api/v1/embeddings"

# Display filter start value; the operator dial changes it at runtime (spec 7).
# Run 19c (60 interviews, name lock D5 + merge_neighbours 12): 163 terms, 114 of
# them said by exactly one person. At 1 the wall drowns the shared concepts in
# singletons; at 2 it shows 49 terms, every one genuinely shared; at 3, 26.
default_min_mentions = 2

server_host = "127.0.0.1"
server_port = 8800
