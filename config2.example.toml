# Kollektivtraum (Tool 2) — auf der Traum-Maschine nach config2.toml kopieren.
# Geheimnisse stehen NICHT hier, sondern in der Umgebung:
#   export ANTHROPIC_API_KEY=...      # Stufe 1: Graph -> Satz
#   export OPENROUTER_API_KEY=...     # Stufe 2: Satz -> Bild

data_dir = "dream-data"

# Tool 1 über das Netz, nie über das Dateisystem (Spec §2, §9).
# Die Adresse druckt der Core beim Start; von DIESER Maschine aus prüfen:
#   curl -s http://<adresse>:8800/graph.json | head -c 200
tool1_url = "http://127.0.0.1:8800"

# Vollständiger Zustand, kein Delta (Spec §4.1). 5 s sind bei 240 s
# Mindestabstand unsichtbar; hier verstellbar, falls das Netz vor Ort zickt.
poll_interval_s = 5.0

# Mindestabstand zwischen zwei Träumen, gemessen ab dem START des letzten.
# Startwert 240 — kalibriert, siehe docs/operations.md.
min_interval_s = 240

# ENTSCHIEDEN von Birk am 2026-08-26, UMGESETZT am 2026-08-28: Die
# Widerspruchs-Klausel fällt ERSATZLOS weg (kg2/condense.py). Begründung: Sie
# zwang ein „aber/oder" in den Satz und provozierte damit Halluzination; die
# Sätze sind auch ohne sie absurd genug (Beleg: out/calibrate-contradiction.txt,
# alle vier Graphgrößen mit und ohne Klausel). Ersetzt durch eine
# Belegbarkeits-Klausel im Prompt: alles muss sich auf das gelieferte Material
# stützen. Die Personen-Schwelle für die alte Klausel gibt es deshalb hier
# nicht mehr — es gibt keine Schwelle mehr zu setzen.

# Die Leitfrage (`guiding_question`) ist am 2026-08-31 ERSATZLOS ENTFALLEN,
# mit ihr die Schalter `default_question_visible` und
# `default_question_seconds`. Seit dem 2026-08-28 erreichte sie kein Modell
# mehr (kg2/condense.py) und stand nur noch als Überschrift über dem Bild —
# eine Anzeige ohne Funktion, die zudem eine vierte Frage zeigte, die den
# Gästen nie gestellt wurde (gefragt wird nach kg.extraction.GUIDING_QUESTIONS
# in Tool 1). Birk an der Station: „Ja, ganz weg."
# Steht eine dieser drei Zeilen noch in einer bestehenden config2.toml, ist
# das folgenlos: kg2/config.py überliest unbekannte Schlüssel, der Start
# scheitert nicht daran. Sie darf trotzdem gelöscht werden.

# EIN Bildregister, den ganzen Tag (Spec §5.2, §10). Wird an jeden Bildprompt
# angehängt, nie vom Modell gewählt. Legt NUR die Machart fest — sie wechselt
# nie von Fotografie zu Aquarell oder Rendering. Stimmung und Spannung sind
# SEIT 2026-08-28 eigene Bausteine (kg2/imagegen.py, aus stage 1's `mood` und
# `tension`) und stehen deshalb NICHT hier.
#
# SEIT 2026-08-28 auf Englisch, wie der gesamte Bildprompt (die Wand bleibt
# deutsch) — Googles eigene Doku für dieses Modell verlangt „beschreibende
# Prosa, keine Schlagwortliste"
# (ai.google.dev/gemini-api/docs/interactions/image-generation).
#
# GRUNDRICHTUNG von Birk am 2026-08-26 entschieden: FOTOREALISTISCH.
# Zusätzlich drei technische Festlegungen aus der Doku-Recherche (alle fix,
# kg2/imagegen.py):
# - Kamera/Objektiv: die neutralste Wahl (Augenhöhe, Normalbrennweite),
#   sonst wählt das Modell pro Durchlauf eine andere Brennweite — genau die
#   wandernde Variable, die die Messreihe kaputtmachen würde.
# - Schriftfreiheit als „Semantic Negative Prompt" (positiv formuliert, nicht
#   verneint) — das Modell ist auf Textrendering optimiert und neigt dazu.
# - Einzelbild-Hinweis, sonst kann das Modell zu einer Infografik oder
#   Mehrfach-Panel-Komposition greifen.
# NOCH NACHZUSCHÄRFEN: der genaue Wortlaut der Machart selbst. Bisherige
# deutsche Muster wirkten auf Birk „runtergekommen"; gesucht ist derselbe
# Fotorealismus in freundlicherem Ton.
#
# WORTLAUT-REGEL (Birk, 2026-08-29): durchgehend POSITIV formuliert. Googles
# „Semantic Negative Prompts" gilt nicht nur für die Schriftfreiheit, sondern
# für den ganzen Text — die frühere Fassung schleppte aus der deutschen
# Vorlage „Not a painting, not an illustration, not an architectural
# rendering" mit, also drei Verneinungen hintereinander, genau das Muster,
# von dem die Doku abrät. Was das Bild sein SOLL, ist beschreibbar; was es
# nicht sein soll, folgt daraus. Wer hier etwas ergänzt: kein „no …", kein
# „not a …", sondern die gewünschte Eigenschaft benennen.
# HYPERREAL, ABER NICHT UNHEIMLICH (Birk, 2026-08-29, an den Registermustern
# aus out/register2-fotoreal/). Er hatte diese Richtung schon am 2026-08-26
# gewählt — „hyperreal von den dreien, unheimlich muss nicht unbedingt sein" —
# und sie ist beim Umbau auf Englisch verlorengegangen: die Fassung davor war
# die NEUTRALSTE der drei (Augenhöhe, Normalbrennweite, analoges Korn), also
# gerade nicht die gewählte. Deshalb wirkten die Tagesverlauf-Bilder vom
# 2026-08-29 auf ihn „ruhig".
#
# Der Unterschied, auf den es ankommt: Hyperrealismus ist eine Aussage über
# SCHÄRFE UND DETAILTREUE, nicht über Stimmung. Der düstere Ton des Kandidaten
# `register-unheimlich-hyperreal` kam aus seinen Zusatzwörtern („kühles
# diffuses Licht, unnatürlich still, zu perfekte Oberflächen") — also aus
# Stimmungsangaben, die im Register gar nichts zu suchen haben. Stimmung kommt
# aus `mood`, Kohärenz aus `tension`, beide aus dem Material (kg2/imagegen.py).
# Wer hier nachschärft: Auflösung, Textur, Materialdetail benennen — niemals
# Licht, Farbe, Atmosphäre oder Zustand der Dinge.
#
# Analoges Korn ist bewusst ENTFALLEN: Korn ist das Gegenteil von
# hyperrealistischer Detailtreue, es verdeckt genau die Mikrostruktur, um die
# es hier geht.
# SCHRIFT IM BILD IST ERLAUBT (Birk, 2026-08-29). Bis dahin stand hier „Every
# surface in the frame is free of writing, bare of signs, labels and
# lettering." Der Grund dafür war, dass der Wandsatz ein eigenes Artefakt ist
# (Spec §5.2) und Text im Bild mit ihm konkurrieren würde.
#
# Aufgehoben, weil das Verbot einen Bildinhalt unmöglich machte, den das
# Material hergibt: Ein Gegenstand, der seine Bedeutung über seine
# Beschriftung trägt — eine Honorartafel mit Neubaupreisen, ein gestempelter
# Plan, ein Plakat mit Anweisungen —, wurde vom Modell zwangsläufig LEER
# gemalt und sagte dann nichts mehr. Beobachtet am 2026-08-29 an
# out/tagesverlauf-einort/1: „hier ist eine Tafel, aber da steht nichts drauf."
# Die Konkurrenz zum Wandsatz nimmt Birk dafür in Kauf.
# Varianten rendern mit: uv run python -m sim.dream_register --out out/registerN
visual_register = "A hyperreal photograph of extreme sharpness and resolution, every surface rendered in fine microscopic detail: the pores of concrete, the fibre of timber, the fine scratches on metal, individual leaves and blades of grass all separately legible. Shot from eye level with a normal focal length, deep focus carrying detail from the foreground to the far background. One single photographic frame, whole and uncut."

condense_model = "claude-opus-5"
condense_effort = "high"

# Vertrag VERIFIZIERT am 2026-08-26 gegen den echten Endpunkt (drei Aufrufe,
# alle HTTP 200) — siehe docs/dream-image-contract.md. Die Request-Form hat
# sich bestätigt; drei Abweichungen in der Response sind dort dokumentiert und
# im Code berücksichtigt (zwei identische Bilder statt einem, content = None,
# Bildformat variiert pro Aufruf zwischen PNG und JPEG). Eine erneute
# Sondierung ist NICHT nötig und kostet ≈ 0,14 USD.
image_model = "google/gemini-3-pro-image"
image_url = "https://openrouter.ai/api/v1/chat/completions"
image_aspect_ratio = "16:9"

# --- Zweiter Renderpfad: Black Forest Labs, EU (2026-08-31) ----------------
#
# "openrouter" ist der Default und der oben verifizierte Weg. "bfl" spricht
# api.eu.bfl.ai an und funktioniert grundsätzlich anders: absenden, auf eine
# batch-artige Antwort pollen, dann eine SIGNIERTE URL herunterladen, die nur
# zehn Minuten gültig ist (Ablauf in kg2/imagegen.py, `_render_bfl`).
#
# Zum Umschalten:
#   image_api_mode = "bfl"
#   image_model = "flux-pro-1.1"                 # hier: der ENDPUNKT
#   image_url = "https://api.eu.bfl.ai/v1"       # hier: die BASIS
#   image_api_key_env = "BFL_API_KEY"
#   image_width = 1344
#   image_height = 768
#
# Der Schlüssel kommt wie alle anderen aus der Umgebung (`export BFL_API_KEY=…`)
# und existiert Stand 2026-08-31 noch nicht — fehlt er, scheitert Stufe 2 mit
# einer Meldung, die die Variable beim Namen nennt, statt mit einem 401.
#
# `image_aspect_ratio` gilt weiter nur für den OpenRouter-Weg (dort reist es als
# `image_config.aspect_ratio`); BFL bekommt stattdessen Pixel. 1344x768 ist 16:9
# in Vielfachen von 32.
image_api_mode = "openrouter"

# Startwerte der Anzeige. Danach gehören sie dem Operator-UI, und ein Neustart
# stellt DESSEN Wert wieder her, nicht diesen hier.
default_fade_ms = 1200           # Überblendung, kein Morph (Spec §6)
default_strip_ratio = 0.22
# Obergrenze für den Streifen: nur die letzten N Träume werden gezeigt, der
# Rest bleibt in dreams.sqlite3 und wird sichtbar, sobald der Wert wieder
# hochgesetzt wird. 40 gleichzeitig auf dem Schirm waren zu viel (Birk,
# 2026-08-26, an den gerenderten Vergleichen).
default_strip_max = 10
default_typewriter = false       # Birk entscheidet vor Ort

# Am Ausstellungstag auf "0.0.0.0", damit das Operator-Fenster von einem
# zweiten Gerät erreichbar ist. 8810, damit beide Tools auf einer Kiste laufen
# können, ohne sich den Port zu nehmen.
server_host = "127.0.0.1"
server_port = 8810
