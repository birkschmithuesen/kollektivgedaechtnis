# Kollektivtraum (Tool 2) — auf der Traum-Maschine nach config2.toml kopieren.
# Geheimnisse stehen NICHT hier, sondern in der Umgebung:
#   export ANTHROPIC_API_KEY=...      # Stufe 1: Graph -> Satz
#   export OPENROUTER_API_KEY=...     # Stufe 2: Satz -> Bild

data_dir = "dream-data"

# Tool 1 über das Netz, nie über das Dateisystem (Spec §2, §9).
# Die Adresse druckt der Core beim Start; von DIESER Maschine aus prüfen:
#   curl -s http://<adresse>:8800/graph.json | head -c 200
tool1_url = "http://127.0.0.1:8800"

# Vollständiger Zustand, kein Delta (Spec §4.1). 5 s sind bei 240 s
# Mindestabstand unsichtbar; hier verstellbar, falls das Netz vor Ort zickt.
poll_interval_s = 5.0

# Mindestabstand zwischen zwei Träumen, gemessen ab dem START des letzten.
# Startwert 240 — kalibriert, siehe docs/operations.md.
min_interval_s = 240

# Ab wie vielen Personen der Widerspruch als Konstruktionsprinzip eingeschaltet
# wird (Spec §5.1).
# ENTSCHIEDEN von Birk am 2026-08-26: Die Widerspruchs-Klausel fällt WEG.
# Begründung: Sie zwingt ein „aber/oder" in den Satz und provoziert damit
# Halluzination; die Sätze sind auch ohne sie absurd genug (Beleg:
# out/calibrate-contradiction.txt, alle vier Graphgrößen mit und ohne Klausel).
# Statt der Klausel wird im Prompt erzwungen, dass alles am Material belegbar
# ist. Solange dieser Umbau nicht erfolgt ist, bleibt der Wert stehen — danach
# entfällt er ersatzlos. Siehe docs/HANDOFF-2026-08-26.md, Punkt B.
contradiction_min_persons = 6

# EINE Leitfrage, den ganzen Tag (Spec §7). Nicht zur Laufzeit änderbar:
# eine wandernde Frage macht den Verlaufsstreifen unlesbar.
# GEWÄHLT von Birk am 2026-08-26 aus vier Kandidaten (Lauf:
# sim.dream_calibrate questions, Ergebnis out/calibrate-questions.txt).
# Begründung: der soziale Miteinander-Aspekt ist ihm wichtig.
# Offen bleibt nur, ob das Programm der NEW bauhaus 2026 eine noch bessere
# Formulierung nahelegt — siehe docs/HANDOFF-2026-08-26.md, Punkt D.
guiding_question = "Wie wollen wir in zehn Jahren zusammen wohnen und bauen?"

# EIN Bildregister, den ganzen Tag (Spec §5.2, §10). Wird an jeden Bildprompt
# angehängt, nie vom Modell gewählt.
# GRUNDRICHTUNG von Birk am 2026-08-26 entschieden: FOTOREALISTISCH. Das
# Register hält fest, dass das Bild immer eine Fotografie ist und nie zur
# Malerei wird — nicht mehr. Stimmung, Grad der Absurdität und Nähe zur
# Realität sollen sich am Material ändern dürfen und gehören NICHT hierher;
# dafür ist ein eigener Analyse-Schritt vorgesehen (docs/HANDOFF-2026-08-26.md,
# Punkte A und F).
# NOCH NACHZUSCHÄRFEN: der genaue Wortlaut. Bisherige Muster wirkten auf Birk
# „runtergekommen"; gesucht ist derselbe Fotorealismus in freundlicherem Ton.
# Varianten rendern mit: uv run python -m sim.dream_register --out out/registerN
visual_register = "Fotorealistische Aufnahme, hohe Detailschärfe, glaubwürdiges Licht, Anmutung einer echten Fotografie. Keine Malerei, keine Illustration, kein Architektur-Rendering, keine Schrift im Bild."

condense_model = "claude-opus-5"
condense_effort = "high"

# Vertrag NOCH NICHT VERIFIZIERT — siehe docs/dream-image-contract.md, vor der
# Ausstellung einmal mit echtem OPENROUTER_API_KEY sondieren.
image_model = "google/gemini-3-pro-image"
image_url = "https://openrouter.ai/api/v1/chat/completions"
image_aspect_ratio = "16:9"

# Startwerte der Anzeige. Danach gehören sie dem Operator-UI, und ein Neustart
# stellt DESSEN Wert wieder her, nicht diesen hier.
default_question_visible = true
default_question_seconds = 0     # 0 = dauerhaft
default_fade_ms = 1200           # Überblendung, kein Morph (Spec §6)
default_strip_ratio = 0.22
# Obergrenze für den Streifen: nur die letzten N Träume werden gezeigt, der
# Rest bleibt in dreams.sqlite3 und wird sichtbar, sobald der Wert wieder
# hochgesetzt wird. 40 gleichzeitig auf dem Schirm waren zu viel (Birk,
# 2026-08-26, an den gerenderten Vergleichen).
default_strip_max = 10
default_typewriter = false       # Birk entscheidet vor Ort

# Am Ausstellungstag auf "0.0.0.0", damit das Operator-Fenster von einem
# zweiten Gerät erreichbar ist. 8810, damit beide Tools auf einer Kiste laufen
# können, ohne sich den Port zu nehmen.
server_host = "127.0.0.1"
server_port = 8810
