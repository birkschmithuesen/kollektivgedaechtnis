# Kollektivtraum (Tool 2) — auf der Traum-Maschine nach config2.toml kopieren.
# Geheimnisse stehen NICHT hier, sondern in der Umgebung:
#   export ANTHROPIC_API_KEY=...      # Stufe 1: Graph -> Satz
#   export OPENROUTER_API_KEY=...     # Stufe 2: Satz -> Bild

data_dir = "dream-data"

# Tool 1 über das Netz, nie über das Dateisystem (Spec §2, §9).
# Die Adresse druckt der Core beim Start; von DIESER Maschine aus prüfen:
#   curl -s http://<adresse>:8800/graph.json | head -c 200
tool1_url = "http://127.0.0.1:8800"

# Vollständiger Zustand, kein Delta (Spec §4.1). 5 s sind bei 240 s
# Mindestabstand unsichtbar; hier verstellbar, falls das Netz vor Ort zickt.
poll_interval_s = 5.0

# Mindestabstand zwischen zwei Träumen, gemessen ab dem START des letzten.
# Startwert 240 — kalibriert, siehe docs/operations.md.
min_interval_s = 240

# ENTSCHIEDEN von Birk am 2026-08-26, UMGESETZT am 2026-08-28: Die
# Widerspruchs-Klausel fällt ERSATZLOS weg (kg2/condense.py). Begründung: Sie
# zwang ein „aber/oder" in den Satz und provozierte damit Halluzination; die
# Sätze sind auch ohne sie absurd genug (Beleg: out/calibrate-contradiction.txt,
# alle vier Graphgrößen mit und ohne Klausel). Ersetzt durch eine
# Belegbarkeits-Klausel im Prompt: alles muss sich auf das gelieferte Material
# stützen. Die Personen-Schwelle für die alte Klausel gibt es deshalb hier
# nicht mehr — es gibt keine Schwelle mehr zu setzen.

# EINE Leitfrage, den ganzen Tag (Spec §7). Nicht zur Laufzeit änderbar:
# eine wandernde Frage macht den Verlaufsstreifen unlesbar.
# GEWÄHLT von Birk am 2026-08-26 aus vier Kandidaten (Lauf:
# sim.dream_calibrate questions, Ergebnis out/calibrate-questions.txt).
# Begründung: der soziale Miteinander-Aspekt ist ihm wichtig.
# SEIT 2026-08-28 steuert dieser Wert AUSSCHLIESSLICH die Überschrift auf dem
# Schirm (kg2/server.py) — nicht mehr den Trauminhalt. Eine sechste Frage, die
# niemand im Raum gestellt bekam, hätte dem Modell eine Leserichtung
# aufgezwungen, die im Material nicht liegen muss (derselbe Fehler wie bei der
# Widerspruchs-Klausel). Siehe kg2/condense.py.
# Offen bleibt nur, ob das Programm der NEW bauhaus 2026 eine noch bessere
# Formulierung nahelegt — siehe docs/HANDOFF-2026-08-26.md, Punkt D.
guiding_question = "Wie wollen wir in zehn Jahren zusammen wohnen und bauen?"

# EIN Bildregister, den ganzen Tag (Spec §5.2, §10). Wird an jeden Bildprompt
# angehängt, nie vom Modell gewählt. Legt NUR die Machart fest — sie wechselt
# nie von Fotografie zu Aquarell oder Rendering. Stimmung und Spannung sind
# SEIT 2026-08-28 eigene Bausteine (kg2/imagegen.py, aus stage 1's `mood` und
# `tension`) und stehen deshalb NICHT hier.
#
# SEIT 2026-08-28 auf Englisch, wie der gesamte Bildprompt (die Wand bleibt
# deutsch) — Googles eigene Doku für dieses Modell verlangt „beschreibende
# Prosa, keine Schlagwortliste"
# (ai.google.dev/gemini-api/docs/interactions/image-generation).
#
# GRUNDRICHTUNG von Birk am 2026-08-26 entschieden: FOTOREALISTISCH.
# Zusätzlich drei technische Festlegungen aus der Doku-Recherche (alle fix,
# kg2/imagegen.py):
# - Kamera/Objektiv: die neutralste Wahl (Augenhöhe, Normalbrennweite),
#   sonst wählt das Modell pro Durchlauf eine andere Brennweite — genau die
#   wandernde Variable, die die Messreihe kaputtmachen würde.
# - Schriftfreiheit als „Semantic Negative Prompt" (positiv formuliert, nicht
#   verneint) — das Modell ist auf Textrendering optimiert und neigt dazu.
# - Einzelbild-Hinweis, sonst kann das Modell zu einer Infografik oder
#   Mehrfach-Panel-Komposition greifen.
# NOCH NACHZUSCHÄRFEN: der genaue Wortlaut der Machart selbst. Bisherige
# deutsche Muster wirkten auf Birk „runtergekommen"; gesucht ist derselbe
# Fotorealismus in freundlicherem Ton.
# Varianten rendern mit: uv run python -m sim.dream_register --out out/registerN
visual_register = "Photographic, high detail, credible light, the look of a genuine photograph. Not a painting, not an illustration, not an architectural rendering. Shot from eye level with a normal focal length and natural depth of field. Every surface in the frame is free of writing: no signs, no labels, no lettering. A single photograph, not a collage or a multi-panel composition."

condense_model = "claude-opus-5"
condense_effort = "high"

# Vertrag NOCH NICHT VERIFIZIERT — siehe docs/dream-image-contract.md, vor der
# Ausstellung einmal mit echtem OPENROUTER_API_KEY sondieren.
image_model = "google/gemini-3-pro-image"
image_url = "https://openrouter.ai/api/v1/chat/completions"
image_aspect_ratio = "16:9"

# Startwerte der Anzeige. Danach gehören sie dem Operator-UI, und ein Neustart
# stellt DESSEN Wert wieder her, nicht diesen hier.
default_question_visible = true
default_question_seconds = 0     # 0 = dauerhaft
default_fade_ms = 1200           # Überblendung, kein Morph (Spec §6)
default_strip_ratio = 0.22
# Obergrenze für den Streifen: nur die letzten N Träume werden gezeigt, der
# Rest bleibt in dreams.sqlite3 und wird sichtbar, sobald der Wert wieder
# hochgesetzt wird. 40 gleichzeitig auf dem Schirm waren zu viel (Birk,
# 2026-08-26, an den gerenderten Vergleichen).
default_strip_max = 10
default_typewriter = false       # Birk entscheidet vor Ort

# Am Ausstellungstag auf "0.0.0.0", damit das Operator-Fenster von einem
# zweiten Gerät erreichbar ist. 8810, damit beide Tools auf einer Kiste laufen
# können, ohne sich den Port zu nehmen.
server_host = "127.0.0.1"
server_port = 8810
