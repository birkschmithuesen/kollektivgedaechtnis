[project]
name = "kollektivgedaechtnis"
version = "0.1.0"
description = "Live interview graph installation (NEW bauhaus 2026)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-telegram-bot>=21.6",
    "pillow>=11.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.48",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The e2e tests talk to real servers and, in one case, spend real Anthropic
# tokens. They must never run by accident: `pytest` deselects them, and
# `pytest -m e2e tests/e2e` is the deliberate way in (docs/operations.md).
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test against real adapters; may cost money. Opt in with -m e2e.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg", "kg2"]
