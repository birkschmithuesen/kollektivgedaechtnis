[project]
name = "kollektivgedaechtnis"
version = "0.1.0"
description = "Live interview graph installation (NEW bauhaus 2026)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-telegram-bot>=21.6",
    "pillow>=11.0",
    "pydantic>=2.9",
    # 🔴 Gesichtserkennung fuer den Portraitzuschnitt (kg/photos.py).
    # Bis 2026-09-01 war das ABSICHTLICH keine Abhaengigkeit: ~50 MB, und die
    # Wahl des Erkenners war noch nicht getroffen. Folge am Geraet: `cv2` war
    # schlicht nicht da, `_gesicht_finden` stieg beim ImportError aus -- ohne
    # Logzeile -- und jedes Foto wurde mittig geschnitten statt aufs Gesicht.
    # Birk: „das foto aus der app wird nicht wie gewuenscht per opencv gezoomed
    # und zentriert." Ein Weg, der nur laeuft, wenn jemand vorher von Hand
    # etwas nachinstalliert, laeuft am Ausstellungstag nicht.
    #
    # `<5` ist Pflicht, nicht Vorsicht: OpenCV 5.0 hat `CascadeClassifier` UND
    # die mitgelieferten Kaskadendateien entfernt. kg/photos.py faengt das ab
    # und warnt -- aber es faellt dann wieder auf den mittigen Schnitt zurueck.
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.48",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The e2e tests talk to real servers and, in one case, spend real Anthropic
# tokens. They must never run by accident: `pytest` deselects them, and
# `pytest -m e2e tests/e2e` is the deliberate way in (docs/operations.md).
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test against real adapters; may cost money. Opt in with -m e2e.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg", "kg2"]
